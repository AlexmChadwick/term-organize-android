name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK 36
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"

      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify, checksum, and open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          apk="term-organize-${version}.apk"
          aab="term-organize-${version}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -q "CN=Android Debug"; then
            echo "Release APK is signed with the debug certificate." >&2
            exit 1
          fi
          jarsigner -verify "$aab"
          sha256sum "$apk" "$aab" > SHA256SUMS
          args=(--draft --title "$tag" --notes "Draft build for download testing. Not a published release.")
          if [[ "$tag" == *-rc* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" "${args[@]}" "$apk" "$aab" SHA256SUMS
