name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK 36
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure FakeBannerClient does not appear in production source
        run: |
          if grep -rn "FakeBannerClient" app/src/main; then
            echo "Error: FakeBannerClient found in app/src/main" >&2
            exit 1
          fi

      - name: Resolve unit test dependencies, lint, and build the debug APK
        run: ./gradlew --no-daemon :app:prepareDebugUnitTests :app:lint :app:assembleDebug --stacktrace

      - name: Cache the Robolectric SDK for offline execution
        run: |
          set -euo pipefail
          sdk=13-robolectric-9030017-i7
          artifact=android-all-instrumented
          directory="$HOME/.m2/repository/org/robolectric/$artifact/$sdk"
          mkdir -p "$directory"
          for extension in jar jar.sha512 pom pom.sha512; do
            file="$artifact-$sdk.$extension"
            curl --fail --silent --show-error --retry 3 \
              "https://repo.maven.apache.org/maven2/org/robolectric/$artifact/$sdk/$file" \
              -o "$directory/$file"
          done

      - name: Run unit tests with loopback only
        run: |
          sudo --preserve-env=HOME,PATH,JAVA_HOME,ANDROID_HOME,ANDROID_SDK_ROOT \
            unshare --net bash -eu -c '
              ip link set lo up
              test -z "$(ip route show)"
              test -z "$(ip -6 route show default)"
              exec setpriv --reuid="$1" --regid="$2" --init-groups \
                ./gradlew --offline --no-daemon :app:testDebugUnitTest --stacktrace
            ' _ "$(id -u)" "$(id -g)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: term-organize-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
