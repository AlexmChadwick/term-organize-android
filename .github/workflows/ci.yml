name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK 36
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests, lint, and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lint :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: term-organize-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
